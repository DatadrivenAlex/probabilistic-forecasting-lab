[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "probabilistic-forecasting-lab"
version = "0.1.0"
description = "Leakage-aware probabilistic time-series forecasting and rolling holdout evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scikit-learn>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
forecast-lab = "forecast_lab.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/forecast_lab"]
